name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v3

      # Desde que la app pasó a usar un Worker con [assets] + KV (wrangler.toml,
      # commit 778adc9), el deploy correcto es "wrangler deploy" (lee
      # wrangler.toml). El comando anterior, "pages deploy", era para el
      # proyecto estático previo y ya no es compatible con este wrangler.toml
      # (que define main=worker.js y kv_namespaces, propios de Workers) --
      # por eso los deploys automáticos venían fallando.
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
