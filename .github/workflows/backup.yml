name: Respaldo nocturno cifrado

# Corre todas las noches a las 23:59 hora de Chile. Cloudflare/GitHub usan
# UTC, así que el cron está en UTC. Chile continental está en horario de
# invierno (UTC-4) hasta el 5 de septiembre de 2026, así que 23:59 local =
# 03:59 UTC del día siguiente = "59 3 * * *". Cuando empiece el horario de
# verano (UTC-3, desde el 6 de septiembre de 2026), hay que cambiar esto a
# "59 2 * * *" para que siga cayendo a las 23:59 hora Chile. GitHub Actions
# no permite crons dependientes de timezone, así que este ajuste es manual
# dos veces al año.
on:
  schedule:
    - cron: "59 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Exportar datos desde D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute app-emergencia-db --remote --json \
            --command "SELECT key, value, updated_at FROM kv_store" \
            > raw_result.json
          jq '.[0].results' raw_result.json > backup_plain.json
          rm raw_result.json
          echo "Filas respaldadas: $(jq 'length' backup_plain.json)"

      - name: Cifrar respaldo
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          mkdir -p backups
          FECHA=$(date -u +%F)
          openssl enc -aes-256-cbc -pbkdf2 -iter 100000 -salt \
            -pass env:BACKUP_ENCRYPTION_KEY \
            -in backup_plain.json \
            -out "backups/${FECHA}.json.enc"
          rm backup_plain.json

      - name: Guardar respaldo en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/
          if git diff --cached --quiet; then
            echo "Sin cambios que respaldar (ya existe el respaldo de hoy)"
          else
            git commit -m "Respaldo automático $(date -u +%F)"
            git push
          fi
